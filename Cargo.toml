[package]
name = "sshm"
version = "0.1.0"
edition = "2024"
description = "Native GPU-rendered SSH manager"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.37"
alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
arboard = { version = "3", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
